{% extends "base.html" %}

{% block content %}
<h2 class="text-center mb-4">Добавить новый товар</h2>
<div class="container col-md-6">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
    </form>
</div>
{% endblock %}

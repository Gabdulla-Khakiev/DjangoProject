{% extends "catalog/base.html" %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<h2 class="text-center mb-4">Удалить товар</h2>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-danger">
            <p>Вы уверены, что хотите удалить товар <strong>{{ object.name }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

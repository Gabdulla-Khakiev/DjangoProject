{% extends "base.html" %}
{% block title %}{{ form.instance.pk|yesno:"Редактирование записи,Новая запись" }}{% endblock %}

{% block content %}
<div class="row mt-5 justify-content-center">
    <div class="col-md-6">
        <div class="p-3 border rounded" style="background-color: #f8f9fa;">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сохранить</button>

                {% if form.instance.pk %}
                    <a href="{% url 'blog:post_detail' form.instance.pk %}" class="btn btn-danger">Отмена</a>
                {% else %}
                    <a href="{% url 'blog:blog_list' %}" class="btn btn-danger">Отмена</a>
                {% endif %}
            </form>
        </div>
    </div>
</div>
{% endblock %}

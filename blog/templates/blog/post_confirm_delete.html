{% extends "base.html" %}
{% block title %}Удаление записи{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="alert alert-danger">
            <h4>Вы уверены, что хотите удалить запись "{{ object.title }}"?</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mt-3 d-flex justify-content-between">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

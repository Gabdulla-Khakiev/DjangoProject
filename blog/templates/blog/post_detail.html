{% extends "base.html" %}
{% block title %}{{ object.title }}{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2>{{ object.title }}</h2>
            {% if object.preview %}
            <img src="{{ object.preview.url }}" class="img-fluid my-3" alt="{{ object.title }}">
            {% endif %}
            <p>{{ object.content|linebreaks }}</p>
            <div class="text-end text-muted mt-4" style="font-size: 0.9rem;">
                {{ post.views_count }} просмотров
            </div>

            <div class="d-flex justify-content-between mt-4">
                <a href="{% url 'blog:blog_list' %}" class="btn btn-primary">Назад</a>
                <a href="{% url 'blog:post_update' object.pk %}" class="btn btn-warning">Редактировать</a>
                <a href="{% url 'blog:post_delete' object.pk %}" class="btn btn-danger">Удалить</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
